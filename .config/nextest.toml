[profile.default]
# A test slower than 30 s is reported; at 120 s it is killed and fails, so a hang
# fails the gate instead of stopping it.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
retries = 0
fail-fast = false

# Load trees write 10⁴ entries each: at most 4 at a time, beside the other tests.
[test-groups]
load = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(ddc-loadgen) & kind(test)'
test-group = 'load'
