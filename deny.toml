# cargo deny check: the dependency part of `make gate` (story "Mandatory gate before
# every commit", DDC-005). No `targets` under [graph]: every platform is checked,
# since DDC-007 builds Linux and Windows too.

[advisories]
# Known vulnerabilities always fail; unmaintained crates fail by default too.
yanked = "deny"
# Unmaintained, with no vulnerability: each kept until its replacement lands,
# and named here with why (2026-11-17).
ignore = [
    # chrono: the Linux trash's DeletionDate, and the `trash` crate's own
    # dependency, which ddc cannot drop alone.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; the trash crate depends on it too" },
    # humantime, unmaintained because it wraps chrono: RFC 3339 times in
    # every report and the journal; its replacement is jiff, a change of its own.
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained, not vulnerable; replacing it with jiff is its own change" },
]

[licenses]
# Permissive licenses only: the workspace is AGPL-3.0-only and also offered
# under a commercial licence, which needs every dependency to allow closed
# redistribution. Anything else, copyleft included, is refused.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[licenses.private]
# The workspace's own crates (AGPL-3.0-only, publish = false): ignoring them
# keeps their licence out of the allow list above, which is for dependencies.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `ddc-core = { path = … }` has no version; allowed because the crates are private.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
