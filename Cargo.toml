[workspace]
members = ["crates/ddc-core", "crates/ddc-cli", "crates/ddc-loadgen"]
resolver = "3"

[workspace.package]
version = "0.13.4"
edition = "2024"
rust-version = "1.89"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/SmartAndPoint/DeepDriveCleaner"
publish = false

[workspace.dependencies]
ddc-core = { path = "crates/ddc-core" }
ddc-loadgen = { path = "crates/ddc-loadgen" }
anyhow = "1.0.100"
clap = { version = "4.6", features = ["derive"] }
dhat = "0.3.3"
humantime = "2.4"
jsonschema = { version = "0.59", default-features = false }
libc = "0.2.191"
proptest = { version = "1.12", default-features = false, features = ["std"] }
rayon = "1.12"
rustix = { version = "1.1", features = ["fs"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
trash = "5.2"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# The release build with line tables, for `make heap-profile` (into target/dhat, so
# it never replaces the release binary).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
