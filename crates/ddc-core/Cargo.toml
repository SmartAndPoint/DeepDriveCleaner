[package]
name = "ddc-core"
description = "DeepDriveCleaner core: parallel filesystem scanner, rule catalog, cleanup planning and execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dhat = { workspace = true, optional = true }
humantime.workspace = true
libc.workspace = true
rayon.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash.workspace = true

[features]
# The gate builds with both, one at a time: they install a global allocator each.
# Cost counters on the hot paths and a counting allocator, for the complexity guard
# (story "Complexity guard: operation counts and scaling exponents", DDC-005). Never
# in a release build.
op-stats = []
# A dhat heap profile of one run (story "Memory and CPU under load: peak memory,
# leaks and CPU time", DDC-005): `make heap-profile`.
dhat-heap = ["dep:dhat"]
# A build whose platform::SUPPORTED is false, so every scan and clean is refused:
# `make unported-check` tests that refusal on macOS, into target/unported (ADR
# "Platform seam: one platform module per OS with declared capabilities", §8). It
# can only turn the switch off. Never in the gate's FEATURES or a release build.
simulate-unported = []

[dev-dependencies]
proptest.workspace = true
schemars.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
