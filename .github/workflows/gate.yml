# The mandatory gate on GitHub (story "Mandatory gate before every commit", DDC-005):
# `make gate` on every push and pull request. `make dist` refuses a commit whose run
# here is not green (scripts/ci-green.sh).
name: Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer run replaces its older one. Every pushed commit keeps its own
# run, never queued behind or replaced by a later push: `make dist` reads the run of
# its HEAD (scripts/ci-green.sh).
concurrency:
  group: gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXTEST_PROFILE: ci
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the gate tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-llvm-cov
          key: tools-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: make tools
      - run: make gate
      # The M-size load checks join here with story "Synthetic load trees: large,
      # wide, deep and hostile".

  coverage:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the gate tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-llvm-cov
          key: tools-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: coverage
      - run: make tools
      - run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: target/lcov.info

  # The app's logic. It runs against the debug CLI, so build that first: without it
  # the real-CLI tests skip themselves.
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: app
      - run: cargo build -p ddc-cli --locked
      - run: make app-test
