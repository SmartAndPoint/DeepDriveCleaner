# The mandatory gate on GitHub (story "Mandatory gate before every commit", DDC-005):
# `make gate` on every branch push, with coverage and the app's tests beside
# it. The M-size load trees run nightly (nightly.yml). `make tag` and `make dist` refuse
# a commit whose run here is not green (scripts/ci-green.sh --full): every required job,
# run on that commit, the Linux and Windows `check-<target>` jobs included (story "Build
# matrix: every target built, tested and packaged from one tag", DDC-007, stage 2).
#
# The Rust jobs wait for `scope` (story "Gate by what changed: load at night, one gate
# per release, app-only pushes skip Rust", DDC-005): a push whose every path since the
# newest fully green ancestor is Rust-free (.config/rust-free-paths) skips them, and the
# run is green on `app` alone. Any doubt, and a failed `scope`, runs them.
name: Gate

# Branch pushes only: a tag push would start a second run of the same commit, and
# scripts/ci-green.sh reads the newest. release.yml runs on the tag. No `pull_request`
# (story "Main only through pull requests, in the code and the vault", DDC-005): every
# PR comes from a branch here, whose push run already posts the checks main requires on
# the head commit. A second run would post the same names, and its `scope` would answer
# `rust`. A fork's PR gets no run: a maintainer pushes its commits to a branch here.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Every pushed commit keeps its own run, never queued behind or replaced by a later
# push: `make dist` reads the run of its HEAD (scripts/ci-green.sh). A run started by
# hand on the same commit waits for the push run.
concurrency:
  group: gate-${{ github.sha }}
  cancel-in-progress: false

env:
  NEXTEST_PROFILE: ci
  CARGO_TERM_COLOR: always

jobs:
  # `rust` or `skip`, from scripts/gate-scope.sh. Never continue-on-error: the Rust jobs
  # run unless it answered `skip`.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Ancestry of the candidate base runs needs the history; it is small.
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scope="$(scripts/gate-scope.sh ci "$GITHUB_SHA" || true)"
          [ "$scope" = skip ] || scope=rust
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Rust jobs: $scope" >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'skip' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the gate tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-llvm-cov
          key: tools-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: make tools
      - run: make gate

  coverage:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'skip' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the gate tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-llvm-cov
          key: tools-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: coverage
      - run: make tools
      - run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json

  # The app's logic. It runs against the debug CLI, so build that first: without it
  # the real-CLI tests skip themselves. It runs on every push, without waiting for scope.
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: app
      - run: cargo build -p ddc-cli --locked
      - run: make app-test

  # The workspace built and tested on Linux and Windows, on their own runners (story
  # "Build matrix: every target built, tested and packaged from one tag", DDC-007).
  # Story "Move OS calls behind the platform module" made it compile there. A test of
  # what is not ported yet skips with a printed "skipped <test>: <reason>" (ADR
  # "Platform seam", §9, amended), and the last step compares those lines with
  # .config/native-skips/<os>.txt, so a new skip is a reviewed diff (stage 2). The
  # names do not carry the runner label, so a label bump renames no check. Both are
  # required checks on main, as gate is. A Rust-free push skips every step, never the
  # job: a matrix job skipped whole is not expanded, so the two check names would never
  # be posted and a pull request requiring them would wait for good.
  # cargo directly: there is no make on Windows.
  check:
    name: check-${{ matrix.target }}
    needs: scope
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: ${{ needs.scope.outputs.scope != 'skip' }}
      - name: Toolchain from rust-toolchain.toml
        if: ${{ needs.scope.outputs.scope != 'skip' }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.scope.outputs.scope != 'skip' }}
        with:
          cache-bin: false
          cache-on-failure: true
          key: check-${{ matrix.target }}
      - name: The nextest version .config/tools.mk pins
        if: ${{ needs.scope.outputs.scope != 'skip' }}
        id: tools
        shell: bash
        run: echo "nextest=$(sed -n 's/^NEXTEST_VERSION := //p' .config/tools.mk)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        if: ${{ needs.scope.outputs.scope != 'skip' }}
        with:
          tool: nextest@${{ steps.tools.outputs.nextest }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
        if: ${{ needs.scope.outputs.scope != 'skip' }}
      # Profile ci (NEXTEST_PROFILE above): every test binary runs, a hang is killed,
      # and a passing test's output is shown, so its skip line reaches the log. On
      # Windows, bash sets HOME and the temp folder lies inside it, under AppData,
      # which the test trees' guard refuses; TMP and TEMP move them out of the home.
      - name: Tests
        if: ${{ needs.scope.outputs.scope != 'skip' }}
        id: tests
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo nextest run --workspace --locked --target ${{ matrix.target }} 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
      # nextest runs no doc tests.
      - name: Doc tests
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'skip' && steps.tests.outcome != 'skipped' }}
        run: cargo test --workspace --doc --locked --target ${{ matrix.target }}
      - name: Skips as .config/native-skips lists them
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'skip' && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: scripts/native-skips.sh "${RUNNER_OS,,}" "$RUNNER_TEMP/native-tests.log"

  # The release CLI as `make dist` builds and checks it before signing (story "Build
  # matrix: every target built, tested and packaged from one tag", DDC-007): release-only
  # breakage (LTO, codegen units, the path remap) shows on the push, not on the
  # owner's Mac in the middle of a release.
  release-build:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'skip' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: release-build
      - run: scripts/build-cli.sh aarch64-apple-darwin
