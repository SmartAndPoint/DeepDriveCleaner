# The nightly tier of the gate (story "Mandatory gate before every commit", DDC-005):
# the full gate and coverage on main, so advisories published since the last commit
# reach `cargo deny`, and a main the Gate's scope rule let through green is caught within
# a day. Later stories add their slots below.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ci
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache the gate tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/bin/cargo-llvm-cov
          key: tools-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: make tools
      - run: make gate
      - run: make coverage

  # AddressSanitizer on a dated nightly (story "Memory and CPU under load: peak memory,
  # leaks and CPU time"), on its own runner so a gate failure does not skip it.
  asan:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: asan
      - run: make asan

  # libFuzzer on the parsers of outside input, ten minutes per target, on the nightly
  # of `asan` (story "Coverage floor and property tests for the safety invariants").
  # cargo-fuzz has a cache of its own: a gate tools cache saved from here would lack
  # the gate's tools. A crash's input is uploaded, to be kept in fuzz/regressions.
  fuzz:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache cargo-fuzz
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: fuzz-tool-${{ runner.os }}-${{ hashFiles('.config/tools.mk') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: fuzz
          workspaces: fuzz
      - run: make fuzz FUZZ_SECONDS=600
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Every load profile at M (10^5 entries) on a disposable disk image, each scanned and
  # checked against its manifest (story "Synthetic load trees: large, wide, deep and
  # hostile"), then the release CLI measured on it, recorded and not judged (story
  # "Memory and CPU under load: peak memory, leaks and CPU time"). It ran on every push
  # until story "Gate by what changed: load at night, one gate per release, app-only
  # pushes skip Rust" (DDC-005): its 17 minutes set the Gate's. A manifest difference or
  # a CLI failure still fails it. The S trees run inside `make gate`.
  load-m:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: load
      - run: make load LOAD_SIZE=M LOAD_LIMITS=record LOAD_REPEAT=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-m
          path: target/load

  # Every profile at M on Linux, 3 runs each, judged against bench/load-limits-linux.tsv
  # (story "Linux scanner and rule catalog", DDC-007): the trees go in marked temporary
  # folders, as Linux has no disk image without root. That file came from `make
  # load-baseline` on this job's runner, a hosted runner being the one Linux reference
  # the repository has; to re-record it, run that target here and commit its artifact.
  load-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: load-linux
      - run: make load LOAD_SIZE=M
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-linux
          path: target/load

  # The tests on real filesystems, as the Gate's linux-mounts job runs them (story "Linux
  # CI mounts: a filesystem matrix job with root-only steps", DDC-010): nightly too, so a
  # runner image that stops mounting one of them shows without a push.
  linux-mounts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: linux-mounts
      - name: The nextest version .config/tools.mk pins
        id: tools
        run: echo "nextest=$(sed -n 's/^NEXTEST_VERSION := //p' .config/tools.mk)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ steps.tools.outputs.nextest }}
      - run: scripts/ci-mounts.sh up /tmp/ddc-mounts >> "$GITHUB_ENV"
      - shell: bash
        run: |
          cargo nextest run --workspace --locked --features ddc-core/op-stats \
            -E "$(scripts/native-skips.sh --filter linux)" 2>&1 | tee "$RUNNER_TEMP/mounts-tests.log"
      - if: ${{ !cancelled() }}
        run: scripts/native-skips.sh --mounts linux "$RUNNER_TEMP/mounts-tests.log"

  # L-size load on its own runner, so a gate or coverage failure does not skip it and
  # their builds do not share its disk: story "Synthetic load trees: large, wide, deep
  # and hostile".
  load:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: load
      - run: make load-image LOAD_PROFILE=mixed LOAD_SIZE=L
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-l
          path: target/load

  # Scaling slopes at M, recorded and judged nowhere (story "Complexity guard: operation
  # counts and scaling exponents"): a hosted runner is neither quiet nor the reference
  # machine. Four builds per profile; the limit is a start, set from the first runs.
  scaling:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: load
      - run: make scaling SCALING_SIZE=M SCALING_LIMITS=record
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scaling-m
          path: target/scaling
